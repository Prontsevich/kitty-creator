<!doctype html>
<html lang="ru" data-theme="dark" tuiTheme="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      try {
        const theme = localStorage.getItem('kitty-creator:theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.setAttribute('tuiTheme', theme);
      } catch {}
    </script>
    <title>Создай своего котика</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
