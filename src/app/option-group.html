<fieldset class="option-group">
  <legend>{{ title() }}</legend>
  <div class="option-grid">
    @for (option of options(); track option.label) {
      <label class="option-tile">
        <input
          type="radio"
          [name]="kind()"
          [value]="option.id ?? 'none'"
          [checked]="selected() === option.id"
          (change)="selectedChange.emit(option.id)"
        />
        <span class="option-content" [class.background-option]="kind() === 'background'">
          <span
            class="option-art-window"
            [class.coat-art]="kind() === 'coat'"
            [class.face-art]="kind() === 'face'"
            [class.accessory-art]="kind() === 'accessory'"
            [class.bow-art]="option.id === 'bow'"
            [class.glasses-art]="option.id === 'glasses'"
            [class.none-art]="option.id === null"
            [class.background-art]="kind() === 'background'"
          >
            <svg class="option-art" viewBox="0 0 512 512" aria-hidden="true">
              @if (option.id) {
                <use [attr.href]="iconSymbol(option.id)" />
              } @else {
                <circle cx="256" cy="256" r="140" fill="none" stroke="#a28470" stroke-width="30" />
                <path
                  d="M157 157 355 355"
                  fill="none"
                  stroke="#a28470"
                  stroke-width="30"
                  stroke-linecap="round"
                />
              }
            </svg>
            @if (kind() === 'background' && option.id === 'butter') {
              <svg class="sun-mark" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="20" fill="#fff9e9" />
                <path
                  d="M50 7v13m0 60v13M7 50h13m60 0h13M20 20l10 10m40 40 10 10m0-60L70 30M30 70 20 80"
                  fill="none"
                  stroke="#fff9e9"
                  stroke-width="5"
                  stroke-linecap="round"
                />
              </svg>
            }
          </span>
          <span class="option-label">{{ option.label }}</span>
        </span>
      </label>
    }
  </div>
</fieldset>
