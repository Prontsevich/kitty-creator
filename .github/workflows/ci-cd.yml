name: CI/CD

on:
  push:
    branches: [demo/random-kitty]

permissions:
  contents: read

concurrency:
  group: kitty-prod
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies from package-lock.json
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Build production app
        run: npm run build

      - name: Test public release checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Package verified release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = {
              "release": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path("dist/kitty-creator/browser/release.json").write_text(json.dumps(release) + "\n")
          PY
          mkdir candidate
          tar -czf candidate/release.tar.gz -C dist/kitty-creator/browser .
          cd candidate
          sha256sum release.tar.gz > SHA256SUMS

      - name: Retain verified release
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: kitty-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: prod
      url: https://kitty.s-pro.space
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the build verified by this run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.check.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error

      - name: Verify archive and release metadata
        run: |
          cd candidate
          sha256sum --check SHA256SUMS
          mkdir ../build
          tar -xzf release.tar.gz -C ../build
          cd ..
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path("build/release.json").read_text())
          expected = {
              "release": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          if any(release.get(key) != value for key, value in expected.items()):
              raise SystemExit("Release metadata does not match this CI/CD run")
          if not Path("build/index.html").is_file():
              raise SystemExit("Release has no index.html")
          PY

      - name: Publish release and verify the public version
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy.sh "$GITHUB_SHA"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/kitty-ssh"
